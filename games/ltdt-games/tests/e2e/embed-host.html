<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trang chủ giả lập – nhúng ltdt-games</title>
    <!--
      Trang chủ giả lập cho tests/e2e/embed.spec.ts, chạy trên dev server:
        /tests/e2e/embed-host.html?user=…&route=%23%2Fgame%2Fdijkstra   nhúng mã nguồn (src/embed.ts)
        &bundle=1   nhúng bản build dist-embed/ (npm run build:embed)
        &hostile=1  bật CSS toàn cục kiểu Bootstrap reboot + Tailwind preflight của trang chủ
    -->
    <style>
      body {
        margin: 0;
      }
      .site-header {
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: #1e293b;
        color: #fff;
        font: 600 16px system-ui, sans-serif;
      }
      #games {
        --lg-play-h: calc(100dvh - 56px);
      }
    </style>
    <style id="host-global" media="not all">
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: #e5e7eb;
      }
      html {
        line-height: 1.5;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
      }
      h1, h2, h3, h4, h5, h6 {
        margin-top: 0;
        margin-bottom: 0.5rem;
        font-weight: 500;
        line-height: 1.2;
        color: #0d6efd;
        font-size: inherit;
      }
      h1 {
        font-size: calc(1.375rem + 1.5vw);
      }
      h2 {
        font-size: calc(1.325rem + 0.9vw);
      }
      h3 {
        font-size: calc(1.3rem + 0.6vw);
      }
      p {
        margin-top: 0;
        margin-bottom: 1rem;
      }
      ol, ul {
        padding-left: 2rem;
        margin-top: 0;
        margin-bottom: 1rem;
      }
      li {
        margin-bottom: 0.25rem;
      }
      a {
        color: #0d6efd;
        text-decoration: underline;
      }
      img, svg, video, canvas {
        display: block;
        vertical-align: middle;
      }
      img, video {
        max-width: 100%;
        height: auto;
      }
      table {
        caption-side: bottom;
        border-collapse: collapse;
      }
      th {
        text-align: inherit;
        font-weight: bold;
      }
      label {
        display: inline-block;
        margin-bottom: 0.5rem;
      }
      button {
        border-radius: 0;
        text-transform: none;
      }
      button, input, select, textarea {
        margin: 0;
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
        color: inherit;
        letter-spacing: normal;
      }
      button, [type="button"] {
        background-color: transparent;
        background-image: none;
      }
      input[type="range"] {
        width: 100%;
      }
      small {
        font-size: 0.875em;
      }
      strong, b {
        font-weight: bolder;
      }
    </style>
  </head>
  <body>
    <header class="site-header">SmartEduAI · Lý thuyết đồ thị</header>
    <div id="games"></div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      if (q.get("hostile") === "1") document.getElementById("host-global").media = "all";
      const bundle = q.get("bundle") === "1";
      if (bundle) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "/dist-embed/ltdt-games.css";
        document.head.append(link);
      }
      const entry = bundle ? "/dist-embed/ltdt-games.js" : "/src/embed.ts";
      const { mountLtdtGames } = await import(/* @vite-ignore */ entry);
      window.__events = [];
      window.__app = mountLtdtGames(document.getElementById("games"), {
        userId: q.get("user") ?? "sv-embed",
        courseId: "LTDT",
        apiBase: "/api/v1",
        hashRouting: false,
        initialRoute: q.get("route") ?? "#/",
        unlockAll: q.get("unlock") === "all",
        authToken: () => "token-thu",
        onEvent: (name, payload) => window.__events.push({ name, payload }),
        // mã nguồn chạy trên dev server: asset nằm ở public/assets
        ...(bundle ? {} : { assetBase: "/assets/" }),
      });
      window.__mounted = true;
    </script>
  </body>
</html>
